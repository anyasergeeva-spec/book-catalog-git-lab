name: Проверка карточки книги

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint-book:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить проверку из основной ветки
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Проверить сам линтер
        run: python3 -m unittest discover -s tests -v
      # Содержимое PR используется только как данные; его код не выполняется.
      - name: Получить предлагаемые изменения
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Проверить карточку
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/lint_pr.py "$PR_BASE_SHA" "$PR_HEAD_SHA" candidate
